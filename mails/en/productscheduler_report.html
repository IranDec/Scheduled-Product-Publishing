<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Scheduled publishing report {shop_name}</title>
</head>
<body style="margin:0;padding:0;background:#f5f8f9;font-family:Arial,Helvetica,sans-serif;color:#363a41">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f8f9;padding:24px 0">
<tr><td align="center">
<table width="640" cellpadding="0" cellspacing="0" style="max-width:640px;background:#ffffff;border-radius:8px;border-top:4px solid #25b9d7">
<tr><td style="padding:22px 24px 6px">
<h2 style="margin:0 0 6px;font-size:18px">Scheduled publishing report</h2>
<p style="margin:0;color:#6c868e;font-size:13px">{shop_name} &middot; Run at {run_time}</p>
</td></tr>
<tr><td style="padding:12px 24px">
<p style="margin:0 0 12px;font-size:14px">Done: <strong>{done}</strong> &nbsp;&middot;&nbsp; Failed: <strong>{failed}</strong></p>
<table width="100%" cellpadding="0" cellspacing="0" style="font-size:13px;border-collapse:collapse">
<tr style="background:#f5f8f9;text-align:left">
<th style="padding:6px 8px">Product</th><th style="padding:6px 8px">Action</th><th style="padding:6px 8px">Status</th><th style="padding:6px 8px">Result</th>
</tr>
{rows_html}
</table>
</td></tr>
<tr><td style="padding:12px 24px 20px;color:#9aabb1;font-size:11px">Scheduled Product Publishing - you can turn this e-mail off in the module settings.</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
